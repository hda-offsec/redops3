<!DOCTYPE html>
<html>

<head>
    <title>Test Attack Surface Map</title>
    <style>
        #network-graph {
            width: 100%;
            height: 600px;
            border: 1px solid #ccc;
            background: #1a1a1a;
        }
    </style>
</head>

<body style="background: #000; color: #fff; font-family: monospace;">
    <h1>Test Attack Surface Map - Vis.js</h1>
    <div id="network-graph"></div>
    <div id="status"></div>

    <script src="/static/js/vis-network.min.js"></script>
    <script>
        const status = document.getElementById('status');

        if (typeof vis === 'undefined') {
            status.innerHTML = '<p style="color: red;">ERROR: vis.js not loaded!</p>';
        } else {
            status.innerHTML = '<p style="color: green;">SUCCESS: vis.js loaded!</p>';

            // Test graph
            const container = document.getElementById('network-graph');
            const nodes = new vis.DataSet([
                { id: 0, label: 'Target', color: '#ff2a2a', shape: 'hexagon', size: 40 },
                { id: 1, label: 'Port 80', color: '#00f0ff', shape: 'dot', size: 15 },
                { id: 2, label: 'Port 443', color: '#00f0ff', shape: 'dot', size: 15 }
            ]);
            const edges = new vis.DataSet([
                { from: 0, to: 1 },
                { from: 0, to: 2 }
            ]);

            const data = { nodes: nodes, edges: edges };
            const options = {
                nodes: { borderWidth: 2, shadow: true, font: { color: '#fff' } },
                edges: { smooth: { type: 'continuous' }, color: { color: '#444' } },
                physics: { stabilization: false }
            };

            const network = new vis.Network(container, data, options);
            status.innerHTML += '<p style="color: green;">Graph initialized successfully!</p>';
        }
    </script>
</body>

</html>
