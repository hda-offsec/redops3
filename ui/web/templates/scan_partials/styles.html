<style>
    :root {
        --glass-bg: rgba(10, 10, 12, 0.7);
        --glass-border: rgba(255, 255, 255, 0.08);
        --cyber-red: var(--critical);
        --cyber-blue: var(--info);
        --cyber-green: var(--low);
        --cyber-yellow: var(--high);
        --cyber-purple: #bc13fe;
    }

    .stat-card {
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid var(--glass-border);
        background: rgba(255, 255, 255, 0.02);
    }

    .stat-card:hover {
        background: rgba(255, 255, 255, 0.08) !important;
        transform: translateY(-4px);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .glass-panel {
        background: var(--bg-card);
        backdrop-filter: blur(16px) saturate(180%);
        border: 1px solid var(--border);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        transition: all 0.3s var(--transition);
        border-radius: 12px;
    }

    .glass-panel:hover {
        border-color: rgba(82, 113, 255, 0.3);
    }

    .glass-header {
        background: rgba(0, 0, 0, 0.2);
        border-bottom: 1px solid var(--border);
        text-transform: uppercase;
        letter-spacing: 0.15rem;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--text-secondary);
        padding: 1rem 1.5rem;
    }

    .tactical-summary-bar {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--border);
        border-radius: 8px;
    }

    .risk-indicator {
        position: relative;
        display: inline-block;
    }

    .pulse-danger {
        box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.4) !important;
        animation: pulse-danger 2s infinite;
    }

    @keyframes pulse-danger {
        0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.4); }
        70% { box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
    }

    .hover-action:hover {
        background: rgba(255, 255, 255, 0.05) !important;
        transform: translateX(5px);
    }

    .animate-flicker {
        animation: flicker 3s linear infinite;
    }

    @keyframes flicker {
        0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
        20%, 22%, 24%, 55% { opacity: 0.5; }
    }

    .discovery-btn {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        color: var(--text-muted);
        font-size: 0.65rem;
        padding: 6px 12px;
        border-radius: 6px;
        text-transform: uppercase;
        letter-spacing: 0.05rem;
        transition: all 0.3s var(--transition);
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
    }

    .discovery-btn.launching {
        color: var(--sev-high);
        border-color: rgba(255, 149, 0, 0.3);
        background: rgba(255, 149, 0, 0.1);
        animation: pulse-launching 1.5s infinite;
    }

    .discovery-btn.active {
        color: var(--sev-low);
        border-color: rgba(52, 199, 89, 0.3);
        background: rgba(52, 199, 89, 0.1);
        animation: pulse-active 2s infinite;
        box-shadow: 0 0 15px rgba(52, 199, 89, 0.1);
    }

    .discovery-btn.discovered {
        color: var(--cyber);
        border-color: rgba(0, 243, 255, 0.3);
        background: rgba(0, 243, 255, 0.08);
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
        font-weight: 700;
    }

    @keyframes pulse-launching {
        0% { opacity: 0.7; }
        50% { opacity: 1; border-color: var(--sev-high); }
        100% { opacity: 0.7; }
    }

    @keyframes pulse-active {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); border-color: var(--sev-low); }
        100% { transform: scale(1); }
    }

    .status-pill {
        text-transform: uppercase;
        letter-spacing: 0.08rem;
        padding: 6px 14px;
        font-weight: 700;
        font-size: 0.7rem;
        border-radius: 20px;
    }

    .status-running {
        background: rgba(82, 113, 255, 0.1) !important;
        color: var(--primary) !important;
        border: 1px solid rgba(82, 113, 255, 0.3) !important;
        animation: pulse-running 2s infinite;
    }

    @keyframes pulse-running {
        0% { opacity: 0.8; }
        50% { opacity: 1; box-shadow: 0 0 10px rgba(82, 113, 255, 0.2); }
        100% { opacity: 0.8; }
    }

    .status-completed, .status-finished {
        background: rgba(52, 199, 89, 0.1) !important;
        color: var(--sev-low) !important;
        border: 1px solid rgba(52, 199, 89, 0.3) !important;
    }

    .status-failed {
        background: rgba(255, 59, 48, 0.1) !important;
        color: var(--sev-critical) !important;
        border: 1px solid rgba(255, 59, 48, 0.3) !important;
    }

    .cursor-pointer { cursor: pointer !important; }
    .hover-bright:hover { filter: brightness(1.2); transition: filter 0.2s; }

    /* RedOps Navigation Overrides */
    .nav-pills .nav-link {
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.05rem;
        color: var(--text-secondary);
        border: 1px solid transparent;
        transition: all 0.3s;
    }

    .nav-pills .nav-link:hover {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-primary);
    }

    .nav-pills .nav-link.active {
        background: rgba(82, 113, 255, 0.12) !important;
        color: var(--primary) !important;
        border: 1px solid rgba(82, 113, 255, 0.2) !important;
    }

    .audit-journey-track {
        display: grid;
        grid-template-columns: repeat(8, minmax(110px, 1fr));
        gap: 0.65rem;
    }

    .audit-stage {
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.22);
        padding: 0.7rem 0.65rem;
        min-height: 84px;
        transition: all 0.2s ease;
    }

    .audit-stage.done {
        border-color: rgba(52, 199, 89, 0.35);
        background: rgba(52, 199, 89, 0.08);
    }

    .audit-stage.in-progress {
        border-color: rgba(82, 113, 255, 0.35);
        background: rgba(82, 113, 255, 0.1);
    }

    .audit-stage.pending {
        border-color: rgba(255, 255, 255, 0.08);
        background: rgba(0, 0, 0, 0.22);
    }

    .audit-stage-index {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        color: var(--text-secondary);
        font-size: 0.72rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 0.4rem;
        font-weight: 700;
    }

    .audit-stage.done .audit-stage-index {
        border-color: rgba(52, 199, 89, 0.7);
        color: var(--cyber-green);
    }

    .audit-stage.in-progress .audit-stage-index {
        border-color: rgba(82, 113, 255, 0.7);
        color: var(--primary);
    }

    .audit-stage-title {
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05rem;
        color: var(--text-primary);
        line-height: 1.1;
    }

    .audit-stage-sub {
        font-size: 0.69rem;
        color: var(--text-muted);
        margin-top: 0.15rem;
    }

    .audit-gates-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(120px, 1fr));
        gap: 0.65rem;
    }

    .audit-gate {
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.2);
        padding: 0.65rem 0.75rem;
    }

    .audit-gate-label {
        font-size: 0.68rem;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 0.06rem;
    }

    .audit-gate-value {
        font-size: 1.15rem;
        font-weight: 800;
        line-height: 1.15;
        margin-top: 0.2rem;
    }

    @media (max-width: 1399px) {
        .audit-journey-track {
            grid-template-columns: repeat(4, minmax(120px, 1fr));
        }
    }

    @media (max-width: 767px) {
        .audit-journey-track {
            grid-template-columns: repeat(2, minmax(120px, 1fr));
        }
        .audit-gates-grid {
            grid-template-columns: repeat(2, minmax(120px, 1fr));
        }
    }
</style>
