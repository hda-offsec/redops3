<!-- TAB 4: ATTACK GRAPH (Graph Explorer) -->
<div class="col-12 mb-3">
    <div
        class="d-flex justify-content-between align-items-center  bg-opacity-50 p-2 rounded border border-secondary border-opacity-25">
        <h5 class="mb-0 text-white ms-2">
            <i class="fas fa-project-diagram me-2 text-info"></i>Execution Graph
            <span id="graph-debug-info" class="badge bg-dark text-muted extra-small ms-3">Initializing...</span>
        </h5>
        <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-cyber" onclick="initGraphData()">
                <i class="fas fa-sync-alt me-1"></i> REBUILD
            </button>
            <div class="btn-group">
                <button class="btn btn-sm btn-outline-cyber active" onclick="setGraphMode('promising')"
                    id="graph-btn-promising">Promising Paths</button>
                <button class="btn btn-sm btn-outline-cyber" onclick="setGraphMode('forensics')"
                    id="graph-btn-forensics">Forensics</button>
                <button class="btn btn-sm btn-outline-cyber" onclick="setGraphMode('surface')"
                    id="graph-btn-surface">Surface Expansion</button>
            </div>
        </div>
    </div>
</div>

<div class="col-12 mb-3">
    <div class="alert alert-dark border-warning bg-opacity-75 fade show d-flex align-items-center mb-0 p-2 d-none"
        id="graph-warning" role="alert">
        <i class="fas fa-exclamation-triangle text-warning me-3 ms-2 fa-lg"></i>
        <div class="x-small text-muted">
            <strong class="text-warning">Interpretation guardrail:</strong> graph edges may represent observations, correlations, or bounded validations unless a node is explicitly marked confirmed vulnerability.
        </div>
    </div>
</div>

<div class="col-lg-9">
    <div class="card shadow-lg border-secondary" style="height: 700px; background: #0b0b0b;">
        <div class="card-header glass-header d-flex justify-content-between align-items-center">
            <span><i class="fas fa-project-diagram me-2"></i>Mission Visualizer</span>
            <div class="d-flex gap-2">
                 <button class="btn btn-xs btn-outline-info" onclick="fitGraph()"><i class="fas fa-expand"></i> Fit</button>
                 <button class="btn btn-xs btn-outline-cyber" onclick="initGraphData()"><i class="fas fa-sync-alt"></i> Rebuild</button>
            </div>
        </div>
        <div class="card-body p-0 position-relative">
            <div id="network-graph" style="width: 100%; height: 100%;"></div>
            <div id="graph-loader" class="position-absolute top-50 start-50 translate-middle text-center d-none">
                <div class="spinner-border text-info mb-2"></div>
                <div class="text-muted small">Synthesizing Graph...</div>
            </div>
        </div>
    </div>
</div>

<div class="col-lg-3">
    <div class="card border-secondary h-100 shadow-sm" style="background: #111;">
        <div class="card-header border-bottom border-secondary extra-small py-2 text-uppercase text-muted">
            <i class="fas fa-fingerprint me-2"></i>Entity Inspector
        </div>
        <div class="card-body p-3" id="graph-inspector-panel">
            <div class="text-center mt-5 text-muted fst-italic">
                <i class="fas fa-mouse-pointer fa-2x opacity-25 mb-3"></i>
                <p class="small mb-0">Select a node or edge to inspect context.</p>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/vis-network.min.js"></script>

<script>
    let network = null;
    let nodes = new vis.DataSet();
    let edges = new vis.DataSet();
    let graphMode = 'promising';

    document.addEventListener("DOMContentLoaded", () => {
        setTimeout(initGraphData, 500);
    });

    async function initGraphData() {
        const loader = document.getElementById('graph-loader');
        if (loader) loader.classList.remove('d-none');
        
        try {
            const scanId = window.scanResults ? (window.scanResults.scan_id || window.scanResults.id) : null;
            if (!scanId) return buildHeuristicGraph();

            const response = await fetch(`/api/scans/${scanId}/graph`);
            const data = await response.json();
            
            nodes.clear();
            edges.clear();

            if (data.nodes && data.nodes.length > 0) {
                data.nodes.forEach(n => {
                    nodes.add(prepareNode(n));
                });
                data.edges.forEach(e => {
                    edges.add({
                        id: `edge_${e.from}_${e.to}`,
                        from: e.from,
                        to: e.to,
                        label: e.type,
                        font: { size: 10, color: '#666', align: 'middle' },
                        color: { color: '#444' },
                        arrows: 'to'
                    });
                });
            } else {
                buildHeuristicGraph();
            }
            
            // Inject Lateral Paths if available
            const lateral = window.scanResults?.phases?.tactical?.lateral_paths || [];
            lateral.forEach((path, idx) => {
                const lpNodeId = `lp_${idx}`;
                nodes.add({
                    id: lpNodeId,
                    label: `🔥\nPIVOT\n${path.title}`,
                    shape: 'diamond',
                    color: { background: '#ff2a2a', border: '#fff' },
                    font: { color: '#fff', bold: true },
                    size: 35,
                    meta: { type: 'Lateral Path', ...path }
                });
                if (path.source) {
                    edges.add({ from: path.source, to: lpNodeId, label: 'pivots from', color: '#ff2a2a', dashes: true });
                }
                if (path.destination) {
                    edges.add({ from: lpNodeId, to: path.destination, label: 'reaches', color: '#ff2a2a', dashes: true });
                }
            });

            createNetwork();
        } catch (err) {
            console.error("Graph Error:", err);
            buildHeuristicGraph();
        } finally {
            if (loader) loader.classList.add('d-none');
        }
    }

    function prepareNode(n) {
        let color = { background: '#222', border: '#444' };
        let shape = 'dot';
        let font = { color: '#aaa', size: 12 };
        let size = 15;
        let label = n.label || n.id;

        const type = (n.type || '').toLowerCase();
        if (type === 'service' || type === 'port') {
            shape = 'hexagon';
            color = { background: '#0b0b0b', border: '#00f0ff' };
            font = { color: '#00f0ff', face: 'monospace' };
            size = 25;
        } else if (type === 'vulnerability' || type === 'finding' || type === 'detection') {
            shape = 'box';
            const sev = (n.data?.severity || 'info').toLowerCase();
            const colorMap = {
                'critical': '#ff2a2a', 'high': '#f39c12',
                'medium': '#f1c40f', 'low': '#3498db', 'info': '#95a5a6'
            };
            color = { background: colorMap[sev] || '#95a5a6', border: '#000' };
            font = { color: '#000', bold: true };
            label = `🚨\n${label}`;
        } else if (type === 'suspicion' || type === 'attack_hypothesis') {
            shape = 'box';
            color = { background: '#5c6370', border: '#d6a645' };
            font = { color: '#fff', bold: true };
            label = `🧭\n${label}`;
        } else if (type === 'validation' || type === 'validated_path') {
            shape = 'box';
            color = { background: '#3c2f12', border: '#f0ad4e' };
            font = { color: '#fff', bold: true };
            label = `🧪\n${label}`;
        } else if (type === 'recommendation') {
            shape = 'box';
            color = { background: '#1f3b5b', border: '#7fb3ff' };
            font = { color: '#fff', bold: true };
            label = `📋\n${label}`;
        } else if (type === 'observation') {
            shape = 'box';
            color = { background: '#1f1f1f', border: '#6c757d' };
            font = { color: '#ddd' };
            label = `👁️\n${label}`;
        } else if (type === 'target' || type === 'seed') {
            shape = 'star';
            color = { background: '#f1c40f', border: '#000' };
            font = { color: '#000', bold: true };
            size = 30;
            label = `🎯\n${label}`;
        } else if (type === 'endpoint') {
            label = `🔗\n${label}`;
        }

        return {
            id: n.id,
            label: label,
            shape: shape,
            color: color,
            font: font,
            size: size,
            title: n.id, // Tooltip
            meta: { type: n.type, ...n.data }
        };
    }

    function createNetwork() {
        const container = document.getElementById('network-graph');
        const data = { nodes: nodes, edges: edges };
        const options = {
            nodes: { borderWidth: 2, shadow: true },
            edges: { 
                smooth: { type: 'cubicBezier', forceDirection: 'none', roundness: 0.5 },
                color: { inherit: 'from' },
                width: 1
            },
            physics: {
                enabled: true,
                barnesHut: { gravitationalConstant: -3000, springLength: 150 },
                stabilization: { iterations: 100 }
            },
            interaction: { hover: true, tooltipDelay: 200 }
        };

        network = new vis.Network(container, data, options);

        network.on("click", (params) => {
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                const node = nodes.get(nodeId);
                inspectEntity(node);
            } else if (params.edges.length > 0) {
                 const edgeId = params.edges[0];
                 const edge = edges.get(edgeId);
                 inspectEntity({ label: edge.label, meta: { type: 'Relationship', from: edge.from, to: edge.to } });
            }
        });
    }

    function inspectEntity(entity) {
        const panel = document.getElementById('graph-inspector-panel');
        let html = `
            <div class="mb-4 text-center">
                <div class="badge bg-cyber text-dark mb-2">${entity.meta?.type || 'Entity'}</div>
                <h5 class="text-white text-break">${entity.label.replace(/[\n🚨🎯🔗]/g, '')}</h5>
            </div>
            <div class="small">
                <h6 class="text-muted extra-small text-uppercase border-bottom border-secondary pb-1 mb-2">Technical Metadata</h6>
                <div class="list-group list-group-flush bg-transparent">
        `;

        const meta = entity.meta || {};
        Object.entries(meta).forEach(([k, v]) => {
            if (k === 'type' || k === 'id') return;
            if (typeof v === 'object') v = `<pre class="extra-small text-info mt-1">${JSON.stringify(v, null, 2)}</pre>`;
            html += `
                <div class="list-group-item bg-transparent text-muted px-0 py-2 border-0">
                    <div class="extra-small text-uppercase opacity-50 mb-1">${k}</div>
                    <div class="text-light text-break">${v || 'N/A'}</div>
                </div>
            `;
        });

        html += `
                </div>
            </div>
        `;
        panel.innerHTML = html;
    }

    function fitGraph() {
        if (network) network.fit({ animation: true });
    }

    function buildHeuristicGraph() {
        // Fallback or static build if API fails
        nodes.clear(); edges.clear();
        const target = window.scanResults?.target || "Target";
        nodes.add({ id: 'target_1', label: `🎯\n${target}`, shape: 'star', color: '#f1c40f', size: 30 });
        createNetwork();
    }
</script>
