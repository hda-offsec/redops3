{% from "components/detection_table.html" import detection_table %}

<!-- TAB 3: FINDINGS (Dependency-Track Inspired) -->
<div class="col-12 mb-3">
    <div
        class="d-flex justify-content-between align-items-center  bg-opacity-20 p-3 rounded border border-secondary border-opacity-10">
        <h5 class="mb-0 text-light fw-bold"><i class="fas fa-biohazard me-2 text-danger"></i>Detection Vault</h5>
        <div class="d-flex gap-2 flex-wrap justify-content-end">
            <div class="input-group input-group-sm" style="max-width: 320px;">
                <span class="input-group-text bg-transparent border-secondary text-muted"><i
                        class="fas fa-search"></i></span>
                <input type="text" id="findings-search" class="form-control bg-transparent border-secondary text-light"
                    placeholder="Filter detections (title, severity, tool)..." onkeyup="filterFindings()">
            </div>
            <select id="findings-category-filter" class="form-select form-select-sm bg-transparent border-secondary text-light" style="max-width: 170px;" onchange="filterFindings()">
                <option value="">All Categories</option>
            </select>
            <select id="findings-severity-filter" class="form-select form-select-sm bg-transparent border-secondary text-light" style="max-width: 140px;" onchange="filterFindings()">
                <option value="">All Severity</option>
                <option value="critical">Critical</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
                <option value="info">Info</option>
            </select>
            <input id="findings-exploit-filter" type="number" min="0" max="100" step="1" class="form-control form-control-sm bg-transparent border-secondary text-light" style="max-width: 150px;" placeholder="Min exploit" oninput="filterFindings()" />
        </div>
    </div>
</div>

<div class="col-lg-12">
    <div class="card h-100">
        <div class="card-header border-0 pb-0">
            <span class="extra-small text-muted text-uppercase">Identification Matrix</span>
        </div>
        <div class="card-body p-0">
            <div id="findings-table-container" style="max-height: 700px; overflow-y: auto;">
                {{ detection_table(findings) }}
            </div>
        </div>
    </div>
</div>

<div class="offcanvas offcanvas-end bg-dark text-light" tabindex="-1" id="findingDetailOffcanvas"
    style="width: 700px; border-left: 1px solid #333;">
    <div class="offcanvas-header border-bottom border-secondary border-opacity-25 pb-3">
        <h5 class="offcanvas-title"><i class="fas fa-microscope me-2 text-warning"></i>Tactical Brief</h5>
        <div>
            <span class="badge border border-secondary text-muted extra-small me-2" id="detail-id">ID: NULL</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                aria-label="Close"></button>
        </div>
    </div>
    <div class="offcanvas-body" id="finding-detail-panel">
        <div class="text-center p-5 text-muted fst-italic">
            <div class="mb-3"><i class="fas fa-hand-pointer fa-3x opacity-10"></i></div>
            <p class="small">Select a discovery record from the identification matrix to retrieve intelligence.</p>
        </div>
    </div>
</div>

<script id="findings-json-data" type="application/json">
{{ findings | tojson }}
</script>
<script>
    // Deserialize JSON natively to avoid parsing and IDE formatter conflict issues
    const findingsList = JSON.parse(document.getElementById('findings-json-data').textContent);
    const rawFindingsData = {};
    findingsList.forEach(f => {
        rawFindingsData[f.id_stable || f.id] = f;
    });

    function filterFindings() {
        const query = document.getElementById('findings-search').value.toLowerCase().trim();
        const severityFilter = (document.getElementById('findings-severity-filter')?.value || '').toLowerCase();
        const categoryFilter = (document.getElementById('findings-category-filter')?.value || '').toLowerCase();
        const minExploitValue = document.getElementById('findings-exploit-filter')?.value;
        const minExploit = minExploitValue === '' ? null : Number(minExploitValue);
        const rows = document.querySelectorAll('.finding-row');

        rows.forEach(row => {
            const t = row.getAttribute('data-title') || '';
            const s = (row.getAttribute('data-sev') || '').toLowerCase();
            const tool = row.getAttribute('data-tool') || '';
            const category = (row.getAttribute('data-category') || '').toLowerCase();
            const exploitRaw = row.getAttribute('data-exploit');
            const exploitScore = exploitRaw === '' || exploitRaw === null ? null : Number(exploitRaw);
            const confidence = row.innerText.toLowerCase();

            let textMatch = false;
            if (query === '') {
                textMatch = true;
            } else if (query === 'high-risk') {
                textMatch = (s === 'high' || s === 'critical');
            } else if (query === 'certain' || query === 'high-confidence') {
                textMatch = confidence.includes('certain') || confidence.includes('high');
            } else {
                textMatch = t.includes(query) || s.includes(query) || tool.includes(query) || category.includes(query);
            }

            const severityMatch = !severityFilter || s === severityFilter;
            const categoryMatch = !categoryFilter || category === categoryFilter;
            const exploitMatch = minExploit === null || (!Number.isNaN(exploitScore) && exploitScore !== null && exploitScore >= minExploit);

            row.style.display = (textMatch && severityMatch && categoryMatch && exploitMatch) ? '' : 'none';
        });
    }


    function populateCategoryFilter() {
        const el = document.getElementById('findings-category-filter');
        if (!el) return;
        const categories = [...new Set(findingsList.map(f => (f.category || '').toLowerCase()).filter(Boolean))].sort();
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            el.appendChild(opt);
        });
    }

    populateCategoryFilter();

    function showFindingDetail(findId) {
        const f = rawFindingsData[findId];
        if (!f) return;

        const panel = document.getElementById('finding-detail-panel');
        document.getElementById('detail-id').textContent = 'ID: ' + findId.substring(0, 8);
        document.getElementById('detail-id').title = findId;

        // Reset Scroll
        panel.scrollTop = 0;

        // Show offcanvas
        const offcanvasEl = document.getElementById('findingDetailOffcanvas');
        const offcanvas = bootstrap.Offcanvas.getInstance(offcanvasEl) || new bootstrap.Offcanvas(offcanvasEl);
        offcanvas.show();

        let cleanDescription = f.description || 'No descriptive payload provided.';
        let evidenceModel = null;

        const jsonMatch = cleanDescription.match(/```json\n([\s\S]*?)\n```/);
        if (jsonMatch) {
            try {
                const parsed = JSON.parse(jsonMatch[1]);
                if (parsed._evidence_model) {
                    evidenceModel = parsed._evidence_model;
                }
            } catch (e) {
                console.error("Failed to parse evidence model", e);
            }
        }

        let html = `
            <div class="mb-4">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <span class="badge-severity bg-${f.severity.toLowerCase()}">${f.severity.toUpperCase()}</span>
                    <span class="badge bg-secondary bg-opacity-10 text-muted border border-secondary border-opacity-10 extra-small">CONF: ${(f.confidence || 'medium').toUpperCase()}</span>
                </div>
                <h4 class="finding-detail-title text-light">${f.title}</h4>
                ${f.target ? `<div class="extra-small text-info mt-1 font-monospace" style="word-break: break-all;"><i class="fas fa-link me-1"></i>${f.target}</div>` : ''}
                ${f.endpoint ? `<div class="extra-small text-muted mt-1 font-monospace" style="word-break: break-all;"><i class="fas fa-route me-1"></i>Endpoint: ${escapeHtml(f.endpoint)}</div>` : ''}
                ${f.parameter ? `<div class="extra-small text-muted mt-1 font-monospace"><i class="fas fa-filter me-1"></i>Parameter: ${escapeHtml(f.parameter)}</div>` : ''}
                ${f.payload ? `<div class="extra-small text-warning mt-1 font-monospace text-truncate"><i class="fas fa-vial me-1"></i>Payload: ${escapeHtml(f.payload)}</div>` : ''}
            </div>
            
            <div class="mb-4 border-start border-3 border-danger border-opacity-50 ps-3 py-1">
                <h6 class="extra-small  text-muted text-uppercase mb-2">Intelligence Summary</h6>
                <div class="text-secondary small lh-sm" style="white-space: pre-wrap;">${cleanDescription}</div>
            </div>
        `;

        if (evidenceModel) {
            let levelColor = 'secondary';
            if (evidenceModel.evidence_level === 'confirmed') levelColor = 'danger';
            else if (evidenceModel.evidence_level === 'probable') levelColor = 'warning';
            else if (evidenceModel.evidence_level === 'heuristic') levelColor = 'info';

            let proofHtml = '';
            if (evidenceModel.proof.markers && evidenceModel.proof.markers.length > 0) {
                proofHtml += `<div class="mt-2"><span class="text-muted small">Markers:</span> <span class="text-light font-monospace small">${escapeHtml(evidenceModel.proof.markers.join(', '))}</span></div>`;
            }
            if (evidenceModel.proof.status_after) {
                proofHtml += `<div class="mt-1"><span class="text-muted small">Status:</span> <span class="text-light font-monospace small">${evidenceModel.proof.status_before || '*'} &rarr; ${evidenceModel.proof.status_after}</span></div>`;
            }

            html += `
            <div class="mb-4 border-start border-3 border-${levelColor} border-opacity-50 ps-3 py-2 bg-black bg-opacity-20 rounded-end">
                <h6 class="extra-small text-muted text-uppercase mb-2 d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-microscope me-2 text-${levelColor}"></i>Evidence Validation</span>
                    <span class="badge bg-${levelColor} bg-opacity-20 text-${levelColor} border border-${levelColor} border-opacity-20">${evidenceModel.evidence_level.toUpperCase()}</span>
                </h6>
                <div class="text-secondary small">
                    ${evidenceModel.verification_required ? '<div class="text-warning mb-2"><i class="fas fa-exclamation-triangle me-1"></i>Manual verification required.</div>' : ''}
                    ${proofHtml}
                </div>
            </div>
            `;
        }

        if (f.screenshot) {
            html += `
             <div class="mb-4">
                <h6 class="extra-small  text-muted text-uppercase mb-2"><i class="fas fa-camera me-1"></i>Visual Evidence</h6>
                <img src="/static/${f.screenshot}" class="img-fluid border border-secondary rounded hover-zoom" style="max-height: 250px; cursor: pointer" onclick="window.open(this.src)">
             </div>
            `;
        }

        // Engine Metadata
        html += `
            <div class="mb-4 bg-opacity-30 p-2 rounded border border-secondary border-opacity-10">
                <div class="d-flex justify-content-between align-items-center extra-small">
                    <span class="text-muted text-uppercase italic">Detection Engine:</span>
                    <span class="text-info fw-bold">${f.tool_source}</span>
                </div>
                ${f.category ? `<div class="extra-small text-secondary mt-1"><span class="text-muted">Category:</span> <span class="text-danger">${escapeHtml(f.category)}</span></div>` : ''}
                ${f.endpoint ? `<div class="extra-small text-secondary mt-1"><span class="text-muted">Endpoint:</span> <span class="font-monospace">${escapeHtml(f.endpoint)}</span></div>` : ''}
                ${f.parameter ? `<div class="extra-small text-secondary mt-1"><span class="text-muted">Parameter:</span> <span class="text-warning">${escapeHtml(f.parameter)}</span></div>` : ''}
                ${f.payload ? `<div class="extra-small text-secondary mt-1"><span class="text-muted">Payload:</span> <span class="text-danger">${escapeHtml(f.payload)}</span></div>` : ''}
                ${f.evidence ? `<div class="extra-small text-secondary mt-1"><span class="text-muted">Evidence:</span> <span class="text-info">${escapeHtml(String(f.evidence).slice(0, 500))}</span></div>` : ''}
                ${f.reproduction ? `<div class="extra-small text-secondary mt-1"><span class="text-muted">Reproduction:</span> <span class="text-warning">${escapeHtml(String(f.reproduction).slice(0, 500))}</span></div>` : ''}
                ${f.exploit_score !== null && f.exploit_score !== undefined ? `<div class="extra-small text-secondary mt-1"><span class="text-muted">Exploit Score:</span> <span class="text-danger">${escapeHtml(String(f.exploit_score))}</span></div>` : ''}
                ${f.risk_level ? `<div class="extra-small text-secondary mt-1"><span class="text-muted">Risk Level:</span> <span class="text-danger text-uppercase">${escapeHtml(String(f.risk_level))}</span></div>` : ''}
                ${f.attack_priority ? `<div class="extra-small text-secondary mt-1"><span class="text-muted">Attack Priority:</span> <span class="text-warning text-uppercase">${escapeHtml(String(f.attack_priority))}</span></div>` : ''}
                ${f.chain_length !== null && f.chain_length !== undefined ? `<div class="extra-small text-secondary mt-1"><span class="text-muted">Chain Length:</span> <span class="text-info">${escapeHtml(String(f.chain_length))}</span></div>` : ''}
                ${f.attack_complexity ? `<div class="extra-small text-secondary mt-1"><span class="text-muted">Attack Complexity:</span> <span class="text-info text-uppercase">${escapeHtml(String(f.attack_complexity))}</span></div>` : ''}
                ${f.signal_ids && f.signal_ids.length ? `<div class="extra-small text-secondary mt-1"><span class="text-muted">Signals:</span> <span class="text-info font-monospace">${escapeHtml(f.signal_ids.join(', '))}</span></div>` : ''}
                ${f.category === 'attack_chain' && f.metadata && f.metadata.chain ? `<div class="extra-small text-secondary mt-1"><span class="text-muted">Chain:</span> <span class="text-danger">${escapeHtml((f.metadata.chain || []).join(' -> '))}</span></div>` : ''}
            </div>
        `;

        // TECHNICAL REPRODUCIBILITY & EVIDENCE (UI Alignment)
        if (f.request || f.response || f.repro_command) {
            html += `
            <div class="mb-4">
                <h6 class="extra-small text-danger text-uppercase mb-3 fw-bold">
                    <i class="fas fa-microscope me-1"></i>TECHNICAL REPRODUCIBILITY & EVIDENCE
                </h6>
                
                ${f.repro_command ? `
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="extra-small text-muted text-uppercase">Reproduction Vector</span>
                    </div>
                    <div class="p-2 rounded border border-danger border-opacity-20 bg-dark position-relative">
                        <button class="btn btn-sm btn-outline-secondary position-absolute top-0 end-0 m-1" onclick="navigator.clipboard.writeText(this.nextElementSibling.innerText)" title="Copy to clipboard"><i class="fas fa-copy"></i></button>
                        <pre class="mb-0 text-warning extra-small text-wrap" style="padding-top: 10px;">${escapeHtml(f.repro_command)}</pre>
                    </div>
                </div>` : ''}

                <div class="accordion accordion-flush bg-black bg-opacity-20 rounded p-1" id="techEvidence">
                    ${f.request ? `
                    <div class="accordion-item bg-transparent">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed bg-transparent text-light extra-small py-2 border-bottom border-secondary border-opacity-10" type="button" data-bs-toggle="collapse" data-bs-target="#collapseReq">
                                <i class="fas fa-arrow-right me-2 text-danger"></i>OFFENSIVE REQUEST
                            </button>
                        </h2>
                        <div id="collapseReq" class="accordion-collapse collapse" data-bs-parent="#techEvidence">
                            <div class="accordion-body p-0 pt-2">
                                <pre class="evidence-block">${escapeHtml(f.request)}</pre>
                            </div>
                        </div>
                    </div>` : ''}
                    
                    ${f.response ? `
                    <div class="accordion-item bg-transparent">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed bg-transparent text-light extra-small py-2 border-bottom border-secondary border-opacity-10" type="button" data-bs-toggle="collapse" data-bs-target="#collapseRes">
                                <i class="fas fa-arrow-left me-2 text-info"></i>SERVER RESPONSE
                            </button>
                        </h2>
                        <div id="collapseRes" class="accordion-collapse collapse" data-bs-parent="#techEvidence">
                            <div class="accordion-body p-0 pt-2">
                                <pre class="evidence-block" style="color: #66ccff;">${escapeHtml(f.response)}</pre>
                            </div>
                        </div>
                    </div>` : ''}
                </div>

                ${(!f.request && !f.response && !f.repro_command) ? `
                    <div class="small text-muted italic mt-2">
                        <i class="fas fa-info-circle me-1"></i> Note: Detailed evidence is available for scans launched after the latest engine update.
                    </div>
                ` : ''}
            </div>
            `;
        }

        html += `
            <div class="mt-4 pt-3 border-top border-secondary border-opacity-10 d-flex gap-2">
                <button class="btn btn-xs btn-outline-info flex-fill" onclick="$('#graph-tab').tab('show')"><i class="fas fa-project-diagram me-1"></i>Graph View</button>
                <button class="btn btn-xs btn-outline-secondary flex-fill" onclick="$('#hood-tab').tab('show')"><i class="fas fa-bug me-1"></i>Raw Log</button>
            </div>
        `;

        panel.innerHTML = html;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>'"]/g,
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag])
        );
    }

    // Global helper for other tabs to open findings
    window.openFindingDrawer = function (findId, titleQuery) {
        const tabBtn = document.getElementById('findings-tab');
        if (tabBtn) {
            const tab = new bootstrap.Tab(tabBtn);
            tab.show();
            // Wait for tab animation 
            setTimeout(() => {
                if (findId) {
                    showFindingDetail(findId);
                } else if (titleQuery) {
                    // Try to find by title
                    const query = titleQuery.toLowerCase();
                    const match = findingsList.find(f => (f.title || '').toLowerCase().includes(query));
                    if (match) {
                        showFindingDetail(match.id_stable || match.id);
                    } else {
                        // Just search in UI
                        document.getElementById('findings-search').value = titleQuery;
                        filterFindings();
                    }
                }
            }, 150);
        } else {
            showFindingDetail(findId);
        }
    };
    window.updateFindingsList = function (newFindings) {
        if (newFindings) {
            // Update local memory
            newFindings.forEach(f => {
                rawFindingsData[f.id_stable || f.id] = f;
            });
        }
        filterFindings();
    };
</script>
