{% from "components/detection_table.html" import detection_table %}

<!-- Strategic Category Board -->
<div class="col-12 mb-3">
    <div class="d-flex flex-wrap gap-2" id="findings-category-stats">
        <!-- Dynamically populated by updateTacticalSummary() -->
    </div>
</div>

<div class="col-12 mb-3">
    <div class="d-flex justify-content-between align-items-center bg-black bg-opacity-20 p-3 rounded border border-secondary border-opacity-10 shadow-sm">
        <h5 class="mb-0 text-light fw-bold">
            <i class="fas fa-biohazard me-2 text-danger"></i>Detection Vault 
            <span class="extra-small text-muted fw-normal ms-2 opacity-50" id="findings-total-label">0 findings</span>
        </h5>
        
        <div class="d-flex gap-2 flex-wrap justify-content-end">
            <div class="input-group input-group-sm" style="max-width: 320px;">
                <span class="input-group-text bg-black border-secondary text-muted"><i class="fas fa-search"></i></span>
                <input type="text" id="findings-search" class="form-control bg-transparent border-secondary text-light"
                    placeholder="Search by title, tool, or target..." onkeyup="filterFindings()">
            </div>
            
            <div class="d-flex gap-1 border-start border-secondary border-opacity-25 ps-2">
                <select id="findings-severity-filter" class="form-select form-select-sm bg-black border-secondary text-light w-auto" onchange="filterFindings()">
                    <option value="">All Sev</option>
                    <option value="critical">Critical</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
                
                <select id="findings-category-filter" class="form-select form-select-sm bg-black border-secondary text-light w-auto" onchange="filterFindings()">
                    <option value="">All Categories</option>
                </select>

                <select id="findings-port-status-filter" class="form-select form-select-sm bg-black border-secondary text-light w-auto" onchange="filterFindings()">
                    <option value="">All Status</option>
                    <option value="open">Open</option>
                    <option value="filtered">Filtered</option>
                    <option value="closed">Closed</option>
                </select>
            </div>
        </div>
    </div>
</div>

<div class="col-lg-12">
    <div class="card h-100 bg-transparent border-0">
        <div class="card-header border-0 pb-1 px-0 bg-transparent">
            <h6 class="extra-small text-muted text-uppercase d-flex align-items-center gap-2 mb-0">
                <i class="fas fa-layer-group"></i> Identification Matrix
            </h6>
        </div>
        <div class="card-body p-0">
            <div id="findings-table-container" style="max-height: 700px; overflow-y: auto;">
                {{ detection_table(findings) }}
            </div>
        </div>
    </div>
</div>

<div class="offcanvas offcanvas-end bg-dark text-light" tabindex="-1" id="findingDetailOffcanvas"
    style="width: 700px; border-left: 1px solid #333;">
    <div class="offcanvas-header border-bottom border-secondary border-opacity-25 pb-3">
        <h5 class="offcanvas-title"><i class="fas fa-microscope me-2 text-warning"></i>Tactical Brief</h5>
        <div>
            <span class="badge border border-secondary text-muted extra-small me-2" id="detail-id">ID: NULL</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                aria-label="Close"></button>
        </div>
    </div>
    <div class="offcanvas-body" id="finding-detail-panel">
        <div class="text-center p-5 text-muted fst-italic">
            <div class="mb-3"><i class="fas fa-hand-pointer fa-3x opacity-10"></i></div>
            <p class="small">Select a discovery record from the identification matrix to retrieve intelligence.</p>
        </div>
    </div>
</div>

<script id="findings-json-data" type="application/json">
{{ findings | tojson }}
</script>
<script>
    // Deserialize JSON natively to avoid parsing and IDE formatter conflict issues
    const findingsList = JSON.parse(document.getElementById('findings-json-data').textContent);
    window.rawFindingsData = {};
    findingsList.forEach(f => {
        window.rawFindingsData[f.id_stable || f.id] = f;
    });

    function filterFindings() {
        const query = document.getElementById('findings-search').value.toLowerCase().trim();
        const severityFilter = (document.getElementById('findings-severity-filter')?.value || '').toLowerCase();
        const categoryFilter = (document.getElementById('findings-category-filter')?.value || '').toLowerCase();
        const portStatusFilter = (document.getElementById('findings-port-status-filter')?.value || '').toLowerCase();
        const rows = document.querySelectorAll('#findings-table-body .finding-row');
        let visibleCount = 0;

        rows.forEach(row => {
            const t = row.getAttribute('data-title') || '';
            const s = (row.getAttribute('data-severity') || row.getAttribute('data-sev') || '').toLowerCase();
            const tool = row.getAttribute('data-tool') || '';
            const category = (row.getAttribute('data-category') || '').toLowerCase();
            const portStatus = (row.getAttribute('data-port-status') || '').toLowerCase();
            const textContent = row.innerText.toLowerCase();

            let textMatch = (query === '') || t.includes(query) || tool.includes(query) || category.includes(query) || textContent.includes(query);
            const severityMatch = !severityFilter || s === severityFilter;
            const categoryMatch = !categoryFilter || category === categoryFilter;
            const portStatusMatch = !portStatusFilter || portStatus === portStatusFilter;

            const isVisible = textMatch && severityMatch && categoryMatch && portStatusMatch;
            row.style.display = isVisible ? '' : 'none';
            if (isVisible) visibleCount++;
        });

        const label = document.getElementById('findings-total-label');
        if (label) label.textContent = `${visibleCount} discoveries`;
        
        // Hide/Show empty state
        const emptyState = document.getElementById('findings-empty-state');
        if (emptyState) emptyState.style.display = visibleCount === 0 ? '' : 'none';
    }

    function populateCategoryFilter() {
        const el = document.getElementById('findings-category-filter');
        if (!el) return;

        const currentCat = el.value;
        const categories = [...new Set(findingsList.map(f => (f.category || '').toLowerCase()).filter(Boolean))].sort();
        
        el.innerHTML = '<option value="">All Categories</option>';
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat.charAt(0).toUpperCase() + cat.slice(1).replace(/_/g, ' ');
            el.appendChild(opt);
        });
        el.value = currentCat;
        
        updateTacticalSummary(categories);
    }

    function updateTacticalSummary(categories) {
        const statsEl = document.getElementById('findings-category-stats');
        if (!statsEl) return;
        statsEl.innerHTML = '';
        
        const counts = {};
        findingsList.forEach(f => {
            const cat = (f.category || 'general').toLowerCase();
            counts[cat] = (counts[cat] || 0) + 1;
        });

        const totalPill = createStatPill('all', findingsList.length, 'primary');
        statsEl.appendChild(totalPill);

        Object.keys(counts).sort((a,b) => counts[b] - counts[a]).forEach(cat => {
            let color = 'secondary';
            if (cat.includes('vuln') || cat.includes('exploit') || cat.includes('cve')) color = 'danger';
            else if (cat.includes('endpoint') || cat === 'api' || cat === 'route') color = 'info';
            else if (cat.includes('leaks') || cat.includes('secret')) color = 'warning';
            else if (cat.includes('osint') || cat.includes('recon') || cat.includes('dns')) color = 'success';
            
            statsEl.appendChild(createStatPill(cat, counts[cat], color));
        });
    }

    function createStatPill(cat, count, color) {
        const div = document.createElement('div');
        div.className = `btn btn-xs btn-outline-${color} bg-${color} bg-opacity-10 d-flex align-items-center gap-2 px-3 py-2 border-opacity-25 rounded-pill cursor-pointer hover-bright`;
        div.style.transition = 'all 0.2s';
        
        const label = cat === 'all' ? 'TOTAL' : cat.toUpperCase().replace(/_/g, ' ');
        div.innerHTML = `
            <span class="extra-small fw-bold opacity-75">${label}</span>
            <span class="badge bg-${color} bg-opacity-25 text-${color} border border-${color} border-opacity-25">${count}</span>
        `;
        
        div.onclick = () => {
            const filterEl = document.getElementById('findings-category-filter');
            filterEl.value = cat === 'all' ? '' : cat;
            filterFindings();
            document.querySelectorAll('#findings-category-stats .btn').forEach(b => {
                b.classList.remove('active', 'border-opacity-100');
                b.style.backgroundColor = '';
            });
            div.classList.add('active', 'border-opacity-100');
            div.style.backgroundColor = 'rgba(255,255,255,0.05)';
        };
        return div;
    }

    populateCategoryFilter();
    filterFindings();



    function isMeaningfulValue(value) {
        if (value === null || value === undefined) return false;
        if (typeof value === 'object') return Object.keys(value).length > 0;
        const normalized = String(value).trim().toLowerCase();
        return normalized !== '' && !['n/a', 'na', 'none', 'null', 'manual', 'todo', 'ui', '-'].includes(normalized);
    }

    function getFindingValidation(finding) {
        return finding?.metadata?.validation || {};
    }

    function getFindingReproducibility(finding) {
        return finding?.metadata?.reproducibility || {};
    }

    function getFindingValidationStatus(finding) {
        const validation = getFindingValidation(finding);
        return validation.status || finding?.metadata?.validation_status || 'not_run';
    }

    function getFindingResultState(finding) {
        const validation = getFindingValidation(finding);
        const candidate = validation.result_state || finding?.result_state || 'observation';
        return isMeaningfulValue(candidate) ? String(candidate).toLowerCase() : 'observation';
    }

    function getFindingPrimaryCommand(finding) {
        const validation = getFindingValidation(finding);
        const reproducibility = getFindingReproducibility(finding);
        const candidate = validation.command || reproducibility.command || finding?.repro_command || finding?.reproduction || '';
        return isMeaningfulValue(candidate) ? candidate : '';
    }

    function getFindingPrimaryUrl(finding) {
        const validation = getFindingValidation(finding);
        const reproducibility = getFindingReproducibility(finding);
        const candidate = validation.target || reproducibility.url || finding?.endpoint || finding?.target || '';
        return isMeaningfulValue(candidate) ? candidate : '';
    }

    function getFindingEvidence(finding) {
        const validation = getFindingValidation(finding);
        const reproducibility = getFindingReproducibility(finding);
        return {
            evidence: isMeaningfulValue(finding?.evidence) ? finding.evidence : '',
            rawOutput: isMeaningfulValue(finding?.raw_output) ? finding.raw_output : '',
            request: isMeaningfulValue(reproducibility.request_excerpt) ? reproducibility.request_excerpt : (isMeaningfulValue(finding?.request) ? finding.request : ''),
            response: isMeaningfulValue(reproducibility.response_excerpt) ? reproducibility.response_excerpt : (isMeaningfulValue(finding?.response) ? finding.response : ''),
            artifact: isMeaningfulValue(validation.artifact) ? validation.artifact : (isMeaningfulValue(finding?.artifact) ? finding.artifact : ''),
        };
    }

    function getFindingVersionInfo(finding) {
        const candidates = [
            finding?.version,
            finding?.metadata?.version,
            finding?.metadata?.service_version,
            finding?.metadata?.detected_version,
            finding?.metadata?.component_version,
        ];
        return candidates.find(isMeaningfulValue) || '';
    }

    function hasMeaningfulProof(finding) {
        const ev = getFindingEvidence(finding);
        return [ev.evidence, ev.rawOutput, ev.request, ev.response, ev.artifact].some(isMeaningfulValue);
    }

    function getFindingAlertTone(finding) {
        const sev = (finding?.severity || 'info').toLowerCase();
        if (sev === 'critical' || sev === 'high') return 'danger';
        if (sev === 'medium') return 'warning';
        return 'secondary';
    }

    function buildCopyButton(value, label) {
        if (!isMeaningfulValue(value)) return '';
        const escaped = escapeHtml(value);
        return `<button class="btn btn-xs btn-outline-secondary ms-2 copy-inline" data-copy="${escaped}"><i class="fas fa-copy me-1"></i>${label}</button>`;
    }

    function decodeDataValue(value) {
        if (!value) return '';
        try {
            return decodeURIComponent(value);
        } catch (_) {
            return value;
        }
    }

    document.addEventListener('click', (event) => {
        const copyBtn = event.target.closest('.copy-inline');
        if (!copyBtn) return;
        const value = copyBtn.getAttribute('data-copy') || '';
        if (!value) return;
        navigator.clipboard.writeText(value);
        const icon = copyBtn.querySelector('i');
        if (icon) {
            icon.className = 'fas fa-check me-1';
            setTimeout(() => {
                icon.className = 'fas fa-copy me-1';
            }, 1500);
        }
    });

    function showFindingDetail(findId) {
        const f = rawFindingsData[findId];
        if (!f) return;

        const panel = document.getElementById('finding-detail-panel');
        document.getElementById('detail-id').textContent = 'ID: ' + findId.substring(0, 8);
        document.getElementById('detail-id').title = findId;
        panel.scrollTop = 0;

        const offcanvasEl = document.getElementById('findingDetailOffcanvas');
        const offcanvas = bootstrap.Offcanvas.getInstance(offcanvasEl) || new bootstrap.Offcanvas(offcanvasEl);
        offcanvas.show();

        const validation = getFindingValidation(f);
        const reproducibility = getFindingReproducibility(f);
        const validationStatus = getFindingValidationStatus(f);
        const primaryCommand = getFindingPrimaryCommand(f);
        const primaryUrl = getFindingPrimaryUrl(f);
        const versionInfo = getFindingVersionInfo(f);
        const evidence = getFindingEvidence(f);
        const alertTone = getFindingAlertTone(f);
        const resultState = getFindingResultState(f);
        const provider = f.provider || f?.metadata?.provider || '';
        const component = f.component || f?.metadata?.component || '';

        const statusToneMap = { success: 'success', failed: 'danger', uncertain: 'warning', not_run: 'secondary' };
        const statusTone = statusToneMap[validationStatus] || 'secondary';
        const isValidated = validationStatus === 'success' || ['confirmed', 'confirmed_active', 'validated'].includes(resultState);

        const validationRows = [
            ['Status', validationStatus],
            ['Target', validation.target || ''],
            ['Command', validation.command || ''],
            ['Expected', validation.expected || ''],
            ['Success criteria', validation.success_criteria || ''],
            ['Failure criteria', validation.failure_criteria || ''],
            ['Uncertainty criteria', validation.uncertainty_criteria || ''],
            ['Downgrade reason', validation.downgrade_reason || ''],
            ['Validation artifact', validation.artifact || ''],
        ].filter(([, value]) => isMeaningfulValue(value));

        const reproducibilityRows = [
            ['Command', reproducibility.command || primaryCommand],
            ['URL', reproducibility.url || primaryUrl],
            ['Arguments', reproducibility.arguments ? JSON.stringify(reproducibility.arguments, null, 2) : (f.arguments ? JSON.stringify(f.arguments, null, 2) : '')],
            ['Request excerpt', evidence.request],
            ['Response excerpt', evidence.response],
        ].filter(([, value]) => isMeaningfulValue(value));

        const proofRows = [
            ['Evidence', evidence.evidence],
            ['Raw output', evidence.rawOutput],
            ['Artifact', evidence.artifact],
        ].filter(([, value]) => isMeaningfulValue(value));

        let html = `
            <div class="mb-4">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <span class="badge-severity bg-${(f.severity || 'info').toLowerCase()}">${(f.severity || 'info').toUpperCase()}</span>
                        <span class="badge bg-secondary bg-opacity-20 text-muted extra-small">CONF: ${(f.confidence || 'medium').toUpperCase()}</span>
                        <span class="badge bg-${statusTone} bg-opacity-20 text-${statusTone} border border-${statusTone} border-opacity-25 extra-small">VALIDATION: ${validationStatus.toUpperCase()}</span>
                        ${isValidated ? '<span class="badge bg-success bg-opacity-20 text-success border border-success border-opacity-25 extra-small">VERIFIED</span>' : ''}
                        <span class="badge bg-${alertTone} bg-opacity-10 text-${alertTone} border border-${alertTone} border-opacity-25 extra-small">STATE: ${resultState.toUpperCase()}</span>
                    </div>
                </div>
                <h4 class="finding-detail-title text-light mb-2">${escapeHtml(f.title || 'Untitled finding')}</h4>
                <div class="extra-small text-muted mb-3 d-flex flex-wrap gap-2">
                    <span class="badge bg-dark border border-secondary text-secondary">${escapeHtml((f.tool_source || f.tool || 'n/a').toUpperCase())}</span>
                    ${f.category ? `<span class="badge bg-secondary bg-opacity-10 text-light border border-secondary border-opacity-25">${escapeHtml(f.category.toUpperCase())}</span>` : ''}
                    ${provider ? `<span class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25">PROVIDER: ${escapeHtml(provider)}</span>` : ''}
                    ${component ? `<span class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25">COMPONENT: ${escapeHtml(component)}</span>` : ''}
                    ${versionInfo ? `<span class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25">VERSION: ${escapeHtml(versionInfo)}</span>` : ''}
                </div>
                ${f.description ? `<div class="small text-muted border border-secondary border-opacity-10 rounded p-2 mb-3">${escapeHtml(f.description)}</div>` : ''}

                <div class="mb-3 p-3 rounded bg-black bg-opacity-30 border border-secondary border-opacity-25">
                    <h6 class="extra-small text-uppercase text-muted mb-2">Section B — Localisation / vecteur</h6>
                    ${primaryUrl ? `<div class="small font-monospace text-info mb-1">${escapeHtml(primaryUrl)}${buildCopyButton(primaryUrl, 'Copy URL')}</div>` : '<div class="small text-muted">No target URL available.</div>'}
                    ${isMeaningfulValue(f.endpoint) && f.endpoint !== primaryUrl ? `<div class="small text-muted">Endpoint: <span class="font-monospace">${escapeHtml(f.endpoint)}</span></div>` : ''}
                    ${isMeaningfulValue(f.target) && f.target !== primaryUrl ? `<div class="small text-muted">Target: <span class="font-monospace">${escapeHtml(f.target)}</span></div>` : ''}
                    ${isMeaningfulValue(f.parameter) ? `<div class="small text-warning">Parameter: <span class="font-monospace">${escapeHtml(f.parameter)}</span></div>` : ''}
                    ${isMeaningfulValue(f.payload) ? `<div class="small text-warning">Payload: <span class="font-monospace">${escapeHtml(f.payload)}</span></div>` : ''}
                </div>

                <div class="mb-3 p-3 rounded bg-black bg-opacity-30 border border-secondary border-opacity-25">
                    <h6 class="extra-small text-uppercase text-muted mb-2">Section C — Validation</h6>
                    ${validationRows.length ? validationRows.map(([label, value]) => `<div class="small mb-1"><span class="text-muted">${label}:</span> <span class="${label.toLowerCase().includes('command') ? 'font-monospace text-warning' : 'text-light'}">${escapeHtml(value)}</span>${label === 'Command' ? buildCopyButton(value, 'Copy command') : ''}</div>`).join('') : '<div class="small text-muted">No structured validation metadata.</div>'}
                </div>

                <div class="mb-3 p-3 rounded bg-black bg-opacity-30 border border-secondary border-opacity-25">
                    <h6 class="extra-small text-uppercase text-muted mb-2">Section D — Reproductibilité</h6>
                    ${reproducibilityRows.length ? reproducibilityRows.map(([label, value]) => `<div class="small mb-2"><div class="text-muted">${label}</div><pre class="evidence-block mb-1">${escapeHtml(value)}</pre>${label === 'Command' ? buildCopyButton(value, 'Copy command') : ''}${label === 'URL' ? buildCopyButton(value, 'Copy URL') : ''}${(label === 'Request excerpt' || label === 'Response excerpt') ? buildCopyButton(value, 'Copy') : ''}</div>`).join('') : '<div class="small text-muted">No reproducibility payload available.</div>'}
                </div>

                <div class="mb-3 p-3 rounded bg-black bg-opacity-30 border border-secondary border-opacity-25">
                    <h6 class="extra-small text-uppercase text-muted mb-2">Section E — Preuve</h6>
                    ${proofRows.length ? proofRows.map(([label, value]) => `<div class="small mb-2"><div class="text-muted">${label}</div><pre class="evidence-block mb-1">${escapeHtml(typeof value === 'string' ? value : JSON.stringify(value, null, 2))}</pre>${buildCopyButton(typeof value === 'string' ? value : JSON.stringify(value, null, 2), 'Copy')}</div>`).join('') : '<div class="small text-muted">No meaningful proof artifact available.</div>'}
                    ${f.screenshot_path ? `<div class="mt-2"><img src="/static/${escapeHtml(f.screenshot_path)}" class="img-fluid border border-secondary rounded shadow-sm" style="max-height: 250px; cursor: pointer" onclick="window.open(this.src)"></div>` : ''}
                </div>

                <div class="mb-3 p-3 rounded bg-black bg-opacity-30 border border-secondary border-opacity-25">
                    <h6 class="extra-small text-uppercase text-muted mb-2">Section F — Actions</h6>
                    <div class="d-flex flex-wrap gap-2">
                        ${primaryCommand ? `<button class="btn btn-sm btn-outline-warning verify-btn" data-command="${encodeURIComponent(primaryCommand)}"><i class="fas fa-play me-1"></i>Verify</button>` : '<button class="btn btn-sm btn-outline-secondary" disabled><i class="fas fa-play me-1"></i>Verify unavailable</button>'}
                        ${primaryCommand ? `<button class="btn btn-sm btn-outline-secondary copy-inline" data-copy="${escapeHtml(primaryCommand)}"><i class="fas fa-copy me-1"></i>Copy command</button>` : ''}
                        ${primaryUrl ? `<button class="btn btn-sm btn-outline-secondary copy-inline" data-copy="${escapeHtml(primaryUrl)}"><i class="fas fa-copy me-1"></i>Copy URL</button>` : ''}
                        ${evidence.request ? `<button class="btn btn-sm btn-outline-secondary copy-inline" data-copy="${escapeHtml(evidence.request)}"><i class="fas fa-copy me-1"></i>Copy request</button>` : ''}
                        ${evidence.response ? `<button class="btn btn-sm btn-outline-secondary copy-inline" data-copy="${escapeHtml(evidence.response)}"><i class="fas fa-copy me-1"></i>Copy response</button>` : ''}
                    </div>
                </div>

                ${!hasMeaningfulProof(f) && !primaryCommand ? '<div class="small text-muted fst-italic">This finding currently carries observation-only data.</div>' : ''}
            </div>
        `;

        panel.innerHTML = html;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>'"]/g,
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag])
        );
    }

    // Global helper for other tabs to open findings
    window.openFindingDrawer = function (findId, titleQuery) {
        const tabBtn = document.getElementById('findings-tab');
        if (tabBtn) {
            const tab = new bootstrap.Tab(tabBtn);
            tab.show();
            // Wait for tab animation 
            setTimeout(() => {
                if (findId) {
                    showFindingDetail(findId);
                } else if (titleQuery) {
                    // Try to find by title
                    const query = titleQuery.toLowerCase();
                    const match = findingsList.find(f => (f.title || '').toLowerCase().includes(query));
                    if (match) {
                        showFindingDetail(match.id_stable || match.id);
                    } else {
                        // Just search in UI
                        document.getElementById('findings-search').value = titleQuery;
                        filterFindings();
                    }
                }
            }, 150);
        } else {
            showFindingDetail(findId);
        }
    };
    window.updateFindingsList = function (newFindings) {
        if (newFindings) {
            newFindings.forEach(f => {
                const fid = f.id_stable || f.id;
                // Update detail map
                const previous = rawFindingsData[fid] || {};
                rawFindingsData[fid] = { ...previous, ...f, metadata: { ...(previous.metadata || {}), ...(f.metadata || {}) } };
                // Update list if not already present
                const existingIndex = findingsList.findIndex(item => (item.id_stable || item.id) === fid);
                if (existingIndex === -1) {
                    findingsList.push(rawFindingsData[fid]);
                } else {
                    findingsList[existingIndex] = rawFindingsData[fid];
                }
            });
            // Re-populate categories to include new discoveries
            populateCategoryFilter();
        }
        filterFindings();
    };
</script>
