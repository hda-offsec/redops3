<!-- TAB 2: ATTACK SURFACE (Normalized Explorer) -->
<div class="col-12 mb-3">
    <div
        class="d-flex justify-content-between align-items-center  bg-opacity-20 p-3 rounded border border-secondary border-opacity-10">
        <h5 class="mb-0 text-light fw-bold"><i class="fas fa-search me-2 text-primary"></i>Universal Explorer</h5>
        <div class="input-group input-group-sm" style="max-width: 450px;">
            <span class="input-group-text bg-transparent border-secondary text-muted"><i
                    class="fas fa-filter"></i></span>
            <input type="text" id="surface-filter" class="form-control bg-transparent border-secondary text-light"
                placeholder="e.g. type:endpoint source:ffuf" onkeyup="window.applySurfaceFilter()">
        </div>
    </div>
</div>

<div class="col-lg-12">
    <div class="card h-100">
        <div class="card-header border-0 pb-0">
            <span class="extra-small text-muted text-uppercase">Surface Matrix</span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive" style="max-height: 700px; overflow-y: auto;">
                <table class="table table-hover mb-0" id="surface-table">
                    <thead>
                        <tr class="extra-small text-muted text-uppercase">
                            <th class="ps-3">Entity / Artifact</th>
                            <th>Category</th>
                            <th>Sensor</th>
                            <th class="text-end pe-3"></th>
                        </tr>
                    </thead>
                    <tbody id="surface-tbody" class=" extra-small">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
                <div id="surface-empty-state" class="text-center p-5 d-none">
                    <i class="fas fa-ghost fa-3x text-muted opacity-10 mb-3"></i>
                    <p class="small text-muted">No tactical surface artifacts match your current filter.</p>
                </div>
            </div>
            <!-- Pagination -->
            <div
                class="d-flex justify-content-between align-items-center p-2 border-top border-secondary border-opacity-10  bg-opacity-10">
                <div class="extra-small text-muted">
                    Total: <span id="surface-count" class="text-info fw-bold">0</span> records
                    <span class="mx-2">|</span>
                    Page: <span id="surface-current-page" class="text-light fw-bold">1</span> / <span id="surface-total-pages" class="text-muted">1</span>
                </div>
                <div class="btn-group">
                    <button class="btn btn-xs btn-outline-secondary" onclick="window.prevSurfacePage()">PREV</button>
                    <button class="btn btn-xs btn-outline-secondary" onclick="window.nextSurfacePage()">NEXT</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="offcanvas offcanvas-end bg-dark text-light" tabindex="-1" id="surfaceContextOffcanvas"
    style="width: 700px; border-left: 1px solid #333;">
    <div class="offcanvas-header border-bottom border-secondary border-opacity-25 pb-3">
        <h5 class="offcanvas-title"><i class="fas fa-info-circle me-2 text-info"></i>Context Panel</h5>
        <div>
            <span class="badge border border-secondary text-muted extra-small me-2" id="surface-id">---</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                aria-label="Close"></button>
        </div>
    </div>
    <div class="offcanvas-body" id="surface-context-panel">
        <div class="text-center p-5 text-muted fst-italic">
            <div class="mb-3"><i class="fas fa-hand-pointer fa-3x opacity-10"></i></div>
            <p class="small">Select a surface artifact to expand technical context.</p>
        </div>
    </div>
</div>

</script>
<script id="surface-json-results" type="application/json">
{{ results | tojson }}
</script>
<script>
    window.rawSurfaceData = [];
    let filteredSurfaceData = [];
    let surfacePage = 1;
    const surfacePerPage = 50;

    // Recursive merge helper for JS
    function deepMergeResults(target, source) {
        for (const key in source) {
            if (source[key] instanceof Object && !Array.isArray(source[key]) && key in target) {
                deepMergeResults(target[key], source[key]);
            } else {
                target[key] = source[key];
            }
        }
        return target;
    }

    // Inject backend data (Normalized safely)
    window.scanResults = JSON.parse(document.getElementById('surface-json-results').textContent);

    document.addEventListener("DOMContentLoaded", () => {
        updateSurfaceExplorer(window.scanResults);
    });

    window.updateSurfaceExplorer = function (newResults) {
        if (newResults) {
            // Merge instead of replace to preserve existing state if partial updates arrive
            window.scanResults = deepMergeResults(window.scanResults || {}, newResults);
        }
        buildSurfaceData();
        window.applySurfaceFilter();
    };

    function buildSurfaceData() {
        window.rawSurfaceData = [];
        const phases = scanResults.phases || {};

        // 1. Nmap Ports (Assets)
        if (phases.recon && phases.recon.open_ports) {
            phases.recon.open_ports.forEach(p => {
                window.rawSurfaceData.push({
                    value: `Port ${p.port} (${p.service_name || p.service || 'unknown'})`,
                    type: 'asset',
                    source: 'nmap',
                    raw: p
                });
            });
        }

        // 2. DNS Subdomains (Assets)
        if (phases.dns && phases.dns.subdomains) {
            phases.dns.subdomains.forEach(d => {
                window.rawSurfaceData.push({
                    value: d,
                    type: 'asset',
                    source: 'dnsrecon',
                    raw: { domain: d }
                });
            });
        }

        // 3. Cloud Assets
        if (phases.osint && phases.osint.cloud) {
            phases.osint.cloud.forEach(c => {
                window.rawSurfaceData.push({
                    value: typeof c === 'string' ? c : c.service || 'Cloud Asset',
                    type: 'asset',
                    source: 'cloud_scanner',
                    raw: c
                });
            });
        }

        // 4. Endpoints (Ffuf/Dirbusting)
        if (phases.dirbusting) {
            Object.keys(phases.dirbusting).forEach(tool => {
                if (phases.dirbusting[tool].endpoints) {
                    phases.dirbusting[tool].endpoints.forEach(e => {
                        window.rawSurfaceData.push({
                            value: typeof e === 'string' ? e : e.url || JSON.stringify(e),
                            type: 'endpoint',
                            source: tool,
                            raw: e,
                            status: e.status || null
                        });
                    });
                }
            });
        }

        // 5. API Endpoints
        if (phases.enum && phases.enum.api) {
            if (phases.enum.api.endpoints) {
                phases.enum.api.endpoints.forEach(e => {
                    window.rawSurfaceData.push({
                        value: typeof e === 'object' ? (e.url || JSON.stringify(e)) : e,
                        type: 'api_route',
                        source: 'kiterunner',
                        raw: e
                    });
                });
            }
            if (phases.enum.api.discovered_endpoints) {
                phases.enum.api.discovered_endpoints.forEach(e => {
                    window.rawSurfaceData.push({
                        value: typeof e === 'object' ? (e.url || JSON.stringify(e)) : e,
                        type: 'api_route',
                        source: 'api_discovery',
                        raw: e
                    });
                });
            }
        }

        // 6. Params (Arjun)
        if (phases.enum && phases.enum.arjun) {
            Object.entries(phases.enum.arjun).forEach(([url, data]) => {
                const params = Array.isArray(data) ? data : data.params || [];
                params.forEach(param => {
                    window.rawSurfaceData.push({
                        value: `${url} ?${param.name || param}=`,
                        type: 'param',
                        source: 'arjun',
                        raw: param
                    });
                });
            });
        }

        // 7. Leaks (Github, JS, Emails)
        if (phases.osint && phases.osint.emails) {
            phases.osint.emails.forEach(e => {
                window.rawSurfaceData.push({
                    value: e,
                    type: 'leak',
                    source: 'osint',
                    raw: { email: e }
                });
            });
        }

        // 8. Katana Spidering URLs
        if (phases.enum && phases.enum.katana) {
            // Katana results might be an array or a dict mapped by port
            if (Array.isArray(phases.enum.katana)) {
                phases.enum.katana.forEach(url => {
                    window.rawSurfaceData.push({
                        value: url,
                        type: 'url',
                        source: 'katana',
                        raw: { url: url }
                    });
                });
            } else {
                Object.entries(phases.enum.katana).forEach(([port, urls]) => {
                    if (Array.isArray(urls)) {
                        urls.forEach(url => {
                            window.rawSurfaceData.push({
                                value: url,
                                type: 'url',
                                source: `katana (port ${port})`,
                                raw: { url: url }
                            });
                        });
                    }
                });
            }
        }

        // 9. Technologies, Components & Versions (WhatWeb/Wappalyzer)
        if (phases.enum && phases.enum.whatweb && phases.enum.whatweb.technologies) {
            Object.entries(phases.enum.whatweb.technologies).forEach(([port, techs]) => {
                if (Array.isArray(techs)) {
                    techs.forEach(tech => {
                        window.rawSurfaceData.push({
                            value: tech,
                            type: 'technology',
                            source: `whatweb (port ${port})`,
                            raw: { tech: tech }
                        });
                    });
                }
            });
        }

        // 10. General Technology Stack (derived/cpe)
        if (phases.enum && phases.enum.derived && phases.enum.derived.service_intelligence) {
            phases.enum.derived.service_intelligence.forEach(intel => {
                if (intel.cpe) {
                    window.rawSurfaceData.push({
                        value: intel.cpe,
                        type: 'component',
                        source: `intel (port ${intel.port})`,
                        raw: intel
                    });
                }
            });
        }

        // 11. JS Audit Discovery (Discovered Endpoints)
        if (phases.enum && phases.enum.js_vuln_audit) {
            Object.entries(phases.enum.js_vuln_audit).forEach(([port, data]) => {
                if (data.discovered_endpoints) {
                    data.discovered_endpoints.forEach(e => {
                        window.rawSurfaceData.push({
                            value: (typeof e === 'object' ? e.value || e.url || JSON.stringify(e) : e),
                            type: 'endpoint',
                            source: `js_audit (port ${port})`,
                            raw: e
                        });
                    });
                }
            });
        }

        // Smart Sort: Prioritize offensive data (endpoints, api routes) over assets/tech
        window.rawSurfaceData.sort((a, b) => {
            const order = { 'endpoint': 1, 'api_route': 2, 'param': 3, 'url': 4, 'leak': 5, 'asset': 10, 'technology': 20 };
            const weightA = order[a.type] || 100;
            const weightB = order[b.type] || 100;
            if (weightA !== weightB) return weightA - weightB;
            return a.value.localeCompare(b.value);
        });
    }

    window.applySurfaceFilter = function() {
        const query = document.getElementById('surface-filter').value.toLowerCase();
        let terms = {};

        if (query.trim() === '') {
            filteredSurfaceData = [...window.rawSurfaceData];
        } else {
            const clauses = query.split(' ');
            clauses.forEach(c => {
                if (c.includes(':')) {
                    const [k, v] = c.split(':');
                    terms[k] = v;
                } else {
                    terms['global'] = (terms['global'] || '') + c + ' ';
                }
            });

            filteredSurfaceData = window.rawSurfaceData.filter(row => {
                let match = true;
                if (terms.type && !row.type.includes(terms.type)) match = false;
                if (terms.source && !(row.source || '').includes(terms.source)) match = false;
                if (terms.global && !row.value.toLowerCase().includes(terms.global.trim())) match = false;
                return match;
            });
        }

        surfacePage = 1;
        window.renderSurfaceTable();
    }

    window.renderSurfaceTable = function() {
        const tbody = document.getElementById('surface-tbody');
        const emptyState = document.getElementById('surface-empty-state');
        const countSpan = document.getElementById('surface-count');
        const pageSpan = document.getElementById('surface-current-page');
        const totalPagesSpan = document.getElementById('surface-total-pages');

        tbody.innerHTML = '';
        countSpan.textContent = filteredSurfaceData.length;
        
        const maxPages = Math.ceil(filteredSurfaceData.length / surfacePerPage) || 1;
        if (surfacePage > maxPages) surfacePage = maxPages;
        
        if (pageSpan) pageSpan.textContent = surfacePage;
        if (totalPagesSpan) totalPagesSpan.textContent = maxPages;

        if (filteredSurfaceData.length === 0) {
            emptyState.classList.remove('d-none');
        } else {
            emptyState.classList.add('d-none');

            const start = (surfacePage - 1) * surfacePerPage;
            const end = start + surfacePerPage;
            const pageData = filteredSurfaceData.slice(start, end);

            pageData.forEach((row, idx) => {
                const tr = document.createElement('tr');
                tr.style.cursor = 'pointer';
                tr.onclick = () => showSurfaceContext(start + idx);

                // Add status badge if available 
                let statusBadge = '';
                if (row.status) {
                    let sColor = 'secondary';
                    if (row.status == 200) sColor = 'success';
                    else if (row.status >= 300 && row.status < 400) sColor = 'warning';
                    else if (row.status >= 400) sColor = 'danger';
                    statusBadge = `<span class="badge bg-${sColor} bg-opacity-25 text-${sColor} border border-${sColor} border-opacity-25 ms-2">${row.status}</span>`;
                }

                // Add nice icon based on type
                let iconHtml = '<i class="fas fa-cube text-secondary"></i>';
                if (row.type === 'asset') iconHtml = '<i class="fas fa-server text-light"></i>';
                else if (row.type === 'endpoint') iconHtml = '<i class="fas fa-link text-info"></i>';
                else if (row.type === 'url') iconHtml = '<i class="fas fa-globe text-primary"></i>';
                else if (row.type === 'api_route') iconHtml = '<i class="fas fa-project-diagram text-warning"></i>';
                else if (row.type === 'technology' || row.type === 'component') iconHtml = '<i class="fas fa-layer-group text-danger"></i>';

                tr.innerHTML = `
                    <td class="ps-3 text-break" style="max-width: 400px;">
                        <div class="d-flex align-items-center gap-2">
                            ${iconHtml}
                            <span class="text-truncate d-inline-block" style="max-width:350px;" title="${row.value}">${row.value}</span>
                            ${statusBadge}
                        </div>
                    </td>
                    <td><span class="badge border border-secondary text-secondary bg-transparent">${row.type}</span></td>
                    <td><span class="badge bg-secondary bg-opacity-25 text-light">${row.source}</span></td>
                    <td class="text-end pe-3"><i class="fas fa-chevron-right text-muted opacity-50"></i></td>
                `;
                tbody.appendChild(tr);
            });
        }
    }

    window.prevSurfacePage = function() {
        if (surfacePage > 1) {
            surfacePage--;
            window.renderSurfaceTable();
        }
    }

    window.nextSurfacePage = function() {
        const maxPages = Math.ceil(filteredSurfaceData.length / surfacePerPage);
        if (surfacePage < maxPages) {
            surfacePage++;
            window.renderSurfaceTable();
        }
    }

    function showSurfaceContext(idx) {
        const data = filteredSurfaceData[idx];
        if (!data) return;

        const panel = document.getElementById('surface-context-panel');
        document.getElementById('surface-id').textContent = data.type.toUpperCase();

        const offcanvasEl = document.getElementById('surfaceContextOffcanvas');
        const offcanvas = bootstrap.Offcanvas.getInstance(offcanvasEl) || new bootstrap.Offcanvas(offcanvasEl);
        offcanvas.show();
        
        // Extract repro command if exists in raw data
        const repro = data.raw && (data.raw.repro_command || data.raw.repro || data.raw.curl_command);

        panel.innerHTML = `
            <div class="mb-4">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <h6 class="text-white text-break fw-bold mb-0">${data.value}</h6>
                    <span class="badge border border-secondary text-secondary extra-small">${data.type.toUpperCase()}</span>
                </div>
                <div class="extra-small text-muted opacity-50"><i class="fas fa-microscope me-1"></i>SOURCE: ${data.source.toUpperCase()}</div>
            </div>

            ${repro ? `
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="extra-small text-info text-uppercase mb-0 fw-bold"><i class="fas fa-terminal me-2"></i>Reproduction Command</h6>
                    <button class="btn btn-xs btn-outline-info" onclick="navigator.clipboard.writeText(\`${repro.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`); alert('Copied to clipboard!')"><i class="fas fa-copy me-1"></i>Copy</button>
                </div>
                <div class="p-3 rounded border border-info border-opacity-20 bg-black bg-opacity-50 font-monospace">
                    <pre class="mb-0 text-info small text-wrap">${repro}</pre>
                </div>
            </div>` : ''}
            
            <div class="border border-secondary border-opacity-25 rounded bg-black bg-opacity-20 p-3 mb-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="text-muted extra-small text-uppercase"><i class="fas fa-code me-1"></i>Raw Object Details</span>
                    <button class="btn btn-xs btn-link text-muted p-0" onclick="console.log('SURFACE_RAW:', ${JSON.stringify(data.raw)})"><i class="fas fa-bug"></i></button>
                </div>
                <pre class="m-0 text-success" style="font-size: 0.75rem; white-space: pre-wrap; max-height: 450px; overflow-y: auto;">${JSON.stringify(data.raw, null, 2)}</pre>
            </div>
        `;
    }
</script>
