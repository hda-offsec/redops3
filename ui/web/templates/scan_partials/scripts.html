<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="{{ url_for('static', filename='js/scan_dashboard.js') }}"></script>

<script type="text/javascript">
    document.addEventListener("DOMContentLoaded", function () {
        // Initialize Dashboard Controller
        const dashboard = new ScanDashboard("{{ scan.id }}", "{{ scan.target.identifier }}");

        // Initial UI Update with server-side rendered data
        {% if results %}
        setTimeout(() => {
            if (typeof updateUI === 'function') {
                updateUI({{ results | tojson | safe }});
            }
        }, 500); // Slight delay to ensure DOM is fully ready
        {% endif %}
    });
</script>
