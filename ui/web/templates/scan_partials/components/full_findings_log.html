{% from "components/detection_table.html" import detection_table %}

<!-- FULL FINDINGS LOG (Normalized) -->
<div class="col-12">
    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="fas fa-clipboard-list me-2"></i>Full Operational Findings Log</span>
            <span
                class="badge bg-secondary bg-opacity-10 text-muted border border-secondary border-opacity-10 extra-small">{{
                findings|length }} RECORDS</span>
        </div>
        <div class="card-body">
            <!-- Filters -->
            <div class="row g-2 mb-3 align-items-center">
                <div class="col-md-5">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-transparent border-secondary text-muted"><i
                                class="fas fa-search"></i></span>
                        <input type="text" id="findingSearch"
                            class="form-control bg-transparent border-secondary text-light"
                            placeholder="Deep filter Findings..." onkeyup="filterFindingsLogs()">
                    </div>
                </div>
                <div class="col-md-7">
                    <div class="d-flex flex-wrap gap-2 justify-content-end">
                        <div class="form-check form-check-inline m-0">
                            <input class="form-check-input bg-transparent border-danger" type="checkbox" checked
                                value="critical" onchange="filterFindingsLogs()">
                            <label class="form-check-label extra-small text-danger">CRITICAL</label>
                        </div>
                        <div class="form-check form-check-inline m-0">
                            <input class="form-check-input bg-transparent border-warning" type="checkbox" checked
                                value="high" onchange="filterFindingsLogs()">
                            <label class="form-check-label extra-small text-warning">HIGH</label>
                        </div>
                        <div class="form-check form-check-inline m-0">
                            <input class="form-check-input bg-transparent border-info" type="checkbox" checked
                                value="medium" onchange="filterFindingsLogs()">
                            <label class="form-check-label extra-small text-info">MEDIUM</label>
                        </div>
                        <div class="form-check form-check-inline m-0">
                            <input class="form-check-input bg-transparent border-success" type="checkbox" checked
                                value="low" onchange="filterFindingsLogs()">
                            <label class="form-check-label extra-small text-success">LOW</label>
                        </div>
                        <div class="form-check form-check-inline m-0">
                            <input class="form-check-input bg-transparent border-secondary" type="checkbox" checked
                                value="info" onchange="filterFindingsLogs()">
                            <label class="form-check-label extra-small text-muted">INFO</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div id="full-findings-container" style="max-height: 600px; overflow-y: auto;">
                {{ detection_table(findings, table_id="full-findings-table") }}
            </div>
        </div>
    </div>
</div>

<script>
    function filterFindingsLogs() {
        const query = document.getElementById('findingSearch').value.toLowerCase();
        const rows = document.querySelectorAll('#full-findings-table .finding-row');

        // Get checked severities
        const checkedSeverities = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
            .map(cb => cb.value.toLowerCase());

        rows.forEach(row => {
            const title = row.getAttribute('data-title');
            const sev = row.getAttribute('data-sev');
            const tool = row.getAttribute('data-tool');

            const matchesQuery = title.includes(query) || tool.includes(query);
            const matchesSeverity = checkedSeverities.includes(sev);

            if (matchesQuery && matchesSeverity) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
    }
</script>
