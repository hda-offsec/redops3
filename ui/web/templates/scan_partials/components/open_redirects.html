<!-- OPEN REDIRECT AUDIT -->
<div class="col-12">
    <div class="card glass-panel">
        <div class="card-header glass-header"><i class="fas fa-directions me-2"></i>Open Redirect Audit
        </div>
        <div class="card-body" id="redirect-results">
            {% if results and results.phases and results.phases.vuln and results.phases.vuln.redirect %}
            <div class="table-responsive">
                <table class="table table-dark table-sm mb-0 small">
                    <thead>
                        <tr class="text-muted">
                            <th>Method</th>
                            <th>Payload URL</th>
                            <th>Reason</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for r in results.phases.vuln.redirect %}
                        <tr>
                            <td class="text-info font-monospace">{{ r.method }}</td>
                            <td class="font-monospace text-break">{{ r.url }}</td>
                            <td class="text-warning">{{ r.evidence }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            {% else %}
            <div class="text-muted small fst-italic">No open redirects confirmed.</div>
            {% endif %}
        </div>
    </div>
</div>
