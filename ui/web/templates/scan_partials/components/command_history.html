<!-- COMMAND HISTORY (PRO AUDIT) -->
{% if results and results.commands %}
<div class="col-12">
    <div class="card  border-warning  bg-opacity-20 mb-4">
        <div class="card-header glass-header text-warning py-1 d-flex justify-content-between align-items-center"
            data-bs-toggle="collapse" data-bs-target="#commandHistoryCollapse" style="cursor: pointer;">
            <span><i class="fas fa-history me-2"></i>Offensive Command Audit (PRO)</span>
            <div class="d-flex align-items-center">
                <span class="badge bg-warning text-dark me-2 x-small">{{ results.commands|length }}
                    executed</span>
                <i class="fas fa-chevron-down small opacity-50"></i>
            </div>
        </div>
        <div id="commandHistoryCollapse" class="collapse">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0 x-small "
                        style="border-collapse: separate; border-spacing: 0;">
                        <thead>
                            <tr class="text-muted opacity-50  bg-opacity-40">
                                <th class="ps-3 py-2 border-bottom border-secondary">Tool</th>
                                <th class="py-2 border-bottom border-secondary">Executed Command Line</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for cmd in results.commands %}
                            <tr>
                                <td class="ps-3 py-2 border-bottom border-secondary border-opacity-25"
                                    style="width: 100px;">
                                    <span class="badge bg-secondary bg-opacity-50 border border-secondary">{{
                                        cmd.tool }}</span>
                                </td>
                                <td class="py-2 text-info border-bottom border-secondary border-opacity-25">
                                    <div class="user-select-all" style="word-break: break-all; opacity: 0.9;">{{
                                        cmd.cmd }}</div>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endif %}
